<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PixelMug App Template 3</title>
  <script>
    const bubbleBridge = document.createElement('script');
    bubbleBridge.src = 'jeesdk://jeeweb.js';
    document.head.appendChild(bubbleBridge);
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <p class="eyebrow">PixelMug App Template 3</p>
    <h1>BOT + WEBAPP + MPY</h1>
    <p>Install the device program, connect over Bluetooth, and move the square with the direction buttons.</p>

    <div class="actions">
      <button id="install-mpy" class="secondary">Install MPY to device</button>
      <button id="connect" class="primary">Connect BLE</button>
      <button id="disconnect">Disconnect BLE</button>
      <button id="reconnect">Reconnect BLE</button>
    </div>
    <p id="status" role="status" aria-live="polite">BLE is disconnected.</p>

    <div class="controls" aria-label="Move the square">
      <button data-direction="up">up</button>
      <div class="horizontal">
        <button data-direction="left">left</button>
        <button data-direction="right">right</button>
      </div>
      <button data-direction="down">down</button>
    </div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
